<svg viewBox="0 0 1060 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title>Second-price auction: truthful bidding is weakly dominant</title>
  <desc>For a bid above value, overbidding either loses (net 0) or wins paying more than the value (net theta_i minus s, negative). For a bid below value, underbidding either wins (net theta_i minus s, positive) or loses (net 0). Bidding the value does at least as well.</desc>
  <style>
    text { font-family: 'EB Garamond', Garamond, Georgia, serif; fill: #151515; }
  </style>
  <defs>
    <marker id="axarrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6a665f"/>
    </marker>
  </defs>
  <text x="250" y="48" text-anchor="middle" font-size="25" fill="#151515">Bid above value</text>
  <line x1="250" y1="478" x2="250" y2="108" stroke="#6a665f" stroke-width="1.6" marker-end="url(#axarrow)"/>
  <text x="234" y="114" text-anchor="end" font-size="19" font-style="italic" fill="#6a665f">value</text>
  <line x1="232" y1="190" x2="268" y2="190" stroke="#c8951f" stroke-width="3"/>
  <text x="224" y="197" text-anchor="end" font-size="23" fill="#c8951f">b</text>
  <line x1="232" y1="395" x2="268" y2="395" stroke="#2457a6" stroke-width="3"/>
  <text x="224" y="402" text-anchor="end" font-size="23" fill="#2457a6">&#952;<tspan dy="4" font-size="13">i</tspan></text>
  <path d="M250,141 l9,9 l-9,9 l-9,-9 Z" fill="#6a665f"/>
  <text x="224" y="156" text-anchor="end" font-size="20" fill="#6a665f">s</text>
  <path d="M250,286 l9,9 l-9,9 l-9,-9 Z" fill="#6a665f"/>
  <text x="224" y="301" text-anchor="end" font-size="20" fill="#6a665f">s</text>
  <text x="280" y="138" text-anchor="start" font-size="19" fill="#151515">overbid loses</text>
  <text x="280" y="162" text-anchor="start" font-size="19" fill="#151515">net 0</text>
  <text x="280" y="283" text-anchor="start" font-size="19" fill="#151515">overbid wins, pays s</text>
  <text x="280" y="307" text-anchor="start" font-size="19" fill="#151515">net &#952;<tspan dy="4" font-size="13">i</tspan><tspan dy="-4"> &#8722; s &lt; 0</tspan></text>
  <text x="250" y="500" text-anchor="middle" font-size="18" fill="#6a665f">overbidding risks</text>
  <text x="250" y="523" text-anchor="middle" font-size="18" fill="#6a665f">a win that loses money</text>
  <line x1="540" y1="108" x2="540" y2="478" stroke="#d8d3ca" stroke-width="1.4" stroke-dasharray="4 6"/>
  <text x="760" y="48" text-anchor="middle" font-size="25" fill="#151515">Bid below value</text>
  <line x1="760" y1="478" x2="760" y2="108" stroke="#6a665f" stroke-width="1.6" marker-end="url(#axarrow)"/>
  <text x="744" y="114" text-anchor="end" font-size="19" font-style="italic" fill="#6a665f">value</text>
  <line x1="742" y1="190" x2="778" y2="190" stroke="#2457a6" stroke-width="3"/>
  <text x="734" y="197" text-anchor="end" font-size="23" fill="#2457a6">&#952;<tspan dy="4" font-size="13">i</tspan></text>
  <line x1="742" y1="395" x2="778" y2="395" stroke="#c8951f" stroke-width="3"/>
  <text x="734" y="402" text-anchor="end" font-size="23" fill="#c8951f">b</text>
  <path d="M760,286 l9,9 l-9,9 l-9,-9 Z" fill="#6a665f"/>
  <text x="734" y="301" text-anchor="end" font-size="20" fill="#6a665f">s</text>
  <path d="M760,431 l9,9 l-9,9 l-9,-9 Z" fill="#6a665f"/>
  <text x="734" y="446" text-anchor="end" font-size="20" fill="#6a665f">s</text>
  <text x="790" y="283" text-anchor="start" font-size="19" fill="#151515">underbid loses</text>
  <text x="790" y="307" text-anchor="start" font-size="19" fill="#151515">net 0</text>
  <text x="790" y="428" text-anchor="start" font-size="19" fill="#151515">underbid wins, pays s</text>
  <text x="790" y="452" text-anchor="start" font-size="19" fill="#151515">net &#952;<tspan dy="4" font-size="13">i</tspan><tspan dy="-4"> &#8722; s &gt; 0</tspan></text>
  <text x="760" y="500" text-anchor="middle" font-size="18" fill="#6a665f">underbidding risks</text>
  <text x="760" y="523" text-anchor="middle" font-size="18" fill="#6a665f">a profitable win missed</text>
  <text x="530" y="548" text-anchor="middle" font-size="19" fill="#151515">s = highest rival bid</text>
  <text x="530" y="572" text-anchor="middle" font-size="19" fill="#151515">either way, bidding your value does at least as well &#8212; weakly dominant</text>
</svg>