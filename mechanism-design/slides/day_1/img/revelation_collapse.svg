<svg viewBox="0 0 1000 735" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title>Revelation principle: every mechanism collapses to a direct mechanism</title>
  <desc>Within the universe of all mechanisms, posted-price, negotiations, and auctions each map to an outcome-equivalent direct mechanism.</desc>
  <style>
    text { font-family: 'EB Garamond', Garamond, Georgia, serif; fill: #151515; }
  </style>
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2457a6"/>
    </marker>
  </defs>

  <!-- Big circle -->
  <circle cx="500" cy="390" r="335" fill="#f7f6f3" stroke="#b9b3a8" stroke-width="2"/>
  <text x="500" y="122" text-anchor="middle" font-size="32" font-weight="700" fill="#6a665f">All mechanisms</text>

  <!-- Family circles -->
  <circle cx="300" cy="310" r="95" fill="#e3ebf6" stroke="#2457a6" stroke-width="2"/>
  <text x="300" y="302" text-anchor="middle" font-size="24">Posted-</text>
  <text x="300" y="330" text-anchor="middle" font-size="24">price</text>

  <circle cx="500" cy="250" r="95" fill="#e3ebf6" stroke="#2457a6" stroke-width="2"/>
  <text x="500" y="258" text-anchor="middle" font-size="24">Negotiations</text>

  <circle cx="700" cy="310" r="95" fill="#e3ebf6" stroke="#2457a6" stroke-width="2"/>
  <text x="700" y="318" text-anchor="middle" font-size="24">Auctions</text>

  <!-- Collapse arrows -->
  <line x1="359" y1="384" x2="447" y2="494" stroke="#2457a6" stroke-width="2.5" marker-end="url(#ah2)"/>
  <line x1="500" y1="345" x2="500" y2="475" stroke="#2457a6" stroke-width="2.5" marker-end="url(#ah2)"/>
  <line x1="641" y1="384" x2="553" y2="494" stroke="#2457a6" stroke-width="2.5" marker-end="url(#ah2)"/>
  <text x="640" y="452" text-anchor="start" font-size="18" fill="#6a665f">same outcome</text>

  <!-- Direct mechanisms -->
  <circle cx="500" cy="560" r="85" fill="#f6d98a" stroke="#c8951f" stroke-width="2"/>
  <text x="500" y="553" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4302">Direct</text>
  <text x="500" y="580" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4302">mechanisms</text>
</svg>
